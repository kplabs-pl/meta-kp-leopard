# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kp-leopard"
BBFILE_PATTERN_meta-kp-leopard = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kp-leopard = "11"

LAYERDEPENDS_meta-kp-leopard = " core meta-kp-classes"
LAYERSERIES_COMPAT_meta-kp-leopard = "scarthgap"
